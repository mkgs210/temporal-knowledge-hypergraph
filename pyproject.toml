[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "tkh-research"
version = "1.0.0"
description = "Auditable native temporal hypergraph hierarchy and matched retrieval study"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==1.26.4", "scipy==1.16.3", "scikit-learn==1.7.2",
  "threadpoolctl==3.6.0", "jsonschema==4.26.0", "mtkahypar==1.7.post1",
  "bm25s==0.3.14", "PyStemmer==3.1.0", "matplotlib==3.10.7",
  "pillow==10.4.0", "reportlab==5.0.1", "tqdm==4.70.1"
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]
labels = ["openai==2.24.0"]
embeddings = ["sentence-transformers==5.2.0", "torch==2.10.0", "transformers==4.57.6",
              "huggingface-hub==0.36.2", "tokenizers==0.22.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
